# Tsing en production : Caddy (HTTPS) → Django (Gunicorn) → PostgreSQL ; IA via le conteneur Ollama existant.
# Lancement (depuis la racine du dépôt) :  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: tsing

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tsing}
      POSTGRES_USER: ${POSTGRES_USER:-tsing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tsing} -d ${POSTGRES_DB:-tsing}"]
      interval: 5s
      retries: 20

  backend:
    build: ../ecommerce_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: ${SITE_ADDRESS}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${SITE_ADDRESS}
      FRONTEND_URL: https://${SITE_ADDRESS}
      CORS_ALLOWED_ORIGINS: https://${SITE_ADDRESS}
      # Conteneur Ollama existant, joint au réseau « tsing-ai » (voir deploy/README.md) — jamais exposé sur Internet.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    volumes:
      - media:/data/media
      - static:/data/static
    networks: [default, ai]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - media:/data/media:ro
      - static:/data/static:ro
      - caddy_data:/data/caddy
      - caddy_config:/config

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:

networks:
  default:
  # Réseau partagé avec le conteneur Ollama déjà en place (créé une fois : docker network create tsing-ai).
  ai:
    name: tsing-ai
    external: true
