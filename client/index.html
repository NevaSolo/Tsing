<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tsing : créez, personnalisez en 3D et vendez vos propres t-shirts." />
    <meta name="theme-color" content="#a40000" />
    <script>
      // Thème appliqué avant l'affichage (évite un flash blanc en mode sombre). Voir src/context/ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#121214");
        } catch (e) {}
      })();
    </script>
    <style>
      /* Animation de chargement Tsing : visible avant le démarrage de React, réutilisée ensuite (BrandLoader). */
      .ts-splash { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #ffffff; }
      .dark .ts-splash { background: #121214; }
      .ts-splash.ts-inline { position: static; min-height: 60vh; background: transparent; }
      .ts-mark { width: 88px; height: 88px; overflow: visible; }
      .ts-mark .tile { fill: #ffffff; stroke: #ead6d6; }
      .dark .ts-mark .tile { fill: #1a1a1e; stroke: #3a2a2a; }
      .ts-mark .ts { fill: #b00000; }
      .dark .ts-mark .ts { fill: #e5383b; }
      .ts-mark .tile { animation: ts-pop .5s cubic-bezier(.2,.9,.3,1.3) both; transform-origin: 32px 32px; }
      .ts-mark .t { animation: ts-drop .55s .25s cubic-bezier(.2,.9,.3,1.2) both; }
      .ts-mark .s { animation: ts-rise .55s .45s cubic-bezier(.2,.9,.3,1.2) both; }
      .ts-word { font-family: "Jaro", "Arial Black", Impact, sans-serif; font-size: 34px; letter-spacing: 6px; color: #b00000; line-height: 1; }
      .dark .ts-word { color: #f87171; }
      .ts-word span { display: inline-block; animation: ts-letter .4s cubic-bezier(.2,.9,.3,1.3) both; }
      .ts-word span:nth-child(1) { animation-delay: .70s; } .ts-word span:nth-child(2) { animation-delay: .78s; }
      .ts-word span:nth-child(3) { animation-delay: .86s; } .ts-word span:nth-child(4) { animation-delay: .94s; }
      .ts-word span:nth-child(5) { animation-delay: 1.02s; }
      .ts-bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(176,0,0,.15); overflow: hidden; }
      .ts-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #b00000; animation: ts-slide 1.1s 1s ease-in-out infinite; transform: translateX(-100%); }
      .dark .ts-bar::after { background: #e5383b; }
      @keyframes ts-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes ts-drop { from { opacity: 0; transform: translateY(-26px); } to { opacity: 1; transform: none; } }
      @keyframes ts-rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
      @keyframes ts-letter { from { opacity: 0; transform: translateY(12px) scale(.8); } to { opacity: 1; transform: none; } }
      @keyframes ts-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .ts-mark *, .ts-word span, .ts-bar::after { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
    <title>Tsing · T-shirts personnalisés en 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Bebas+Neue&family=Caveat:wght@700&family=Dancing+Script:wght@700&family=Indie+Flower&family=Jaro&family=Lobster&family=Merriweather:wght@700&family=Montserrat:wght@700&family=Orbitron:wght@700&family=Oswald:wght@600&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@700&family=Quicksand:wght@700&family=Raleway:wght@700&family=Roboto:wght@700&family=Shadows+Into+Light&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div class="ts-splash" role="status" aria-label="Chargement de Tsing">
        <svg class="ts-mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect class="tile" x="1" y="1" width="62" height="62" rx="14" stroke-width="2" />
          <g class="ts t"><rect x="7" y="13" width="23" height="8" rx="1.5" /><rect x="14.5" y="13" width="8" height="38" rx="1.5" /></g>
          <g class="ts s"><rect x="34" y="13" width="23" height="8" rx="1.5" /><rect x="34" y="13" width="8" height="22" rx="1.5" /><rect x="34" y="28" width="23" height="8" rx="1.5" /><rect x="49" y="28" width="8" height="23" rx="1.5" /><rect x="34" y="43" width="23" height="8" rx="1.5" /></g>
        </svg>
        <div class="ts-word" aria-hidden="true"><span>T</span><span>S</span><span>I</span><span>N</span><span>G</span></div>
        <div class="ts-bar" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
